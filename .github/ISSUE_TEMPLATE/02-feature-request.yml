name: Feature request
description: Propose a new capability or UX improvement.
title: '[Feature]: '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Use this form for product enhancements. Keep requests concrete and testable.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem or limitation are you trying to solve?
      placeholder: Describe the current pain point.
    validations:
      required: true
  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed Solution
      description: What should the product do?
      placeholder: Describe the desired behavior or UI.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: List alternatives or tradeoffs you considered.
      placeholder: Describe other options and why they are less suitable.
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance Criteria
      description: Use a checklist of observable outcomes.
      placeholder: |
        - [ ] ...
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Primary Area
      description: Which part of the app is most affected?
      options:
        - Color generation / contrast logic
        - UI components / interactions
        - Accessibility / keyboard / screen reader
        - URL or localStorage persistence
        - Export formats
        - Tests / CI workflow
        - Documentation
        - Other
    validations:
      required: true
  - type: dropdown
    id: accessibility_impact
    attributes:
      label: Accessibility Impact
      description: How does this request affect accessibility goals?
      options:
        - Improves accessibility
        - No direct accessibility impact
        - Could create accessibility risk
        - Unknown
    validations:
      required: true
  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context
      description: Include mockups, references, or related issue links.
      placeholder: Add links or screenshots if helpful.
  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submit Checklist
      options:
        - label: I searched existing issues to avoid creating a duplicate.
          required: true
