name: Deploy Smoke Tests

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Deployed site URL to smoke test'
        required: false
        default: 'https://chroma11y.app'
        type: string

jobs:
  smoke:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium --with-deps

      - name: Run deploy smoke checks
        run: npx playwright test e2e/deploy-smoke.spec.ts --project=chromium
        env:
          PLAYWRIGHT_TEST_BASE_URL: ${{ inputs.base_url }}
          ARGOS_UPLOAD: 'false'

      - name: Upload smoke test report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: deploy-smoke-report
          path: playwright-report/
          retention-days: 30
