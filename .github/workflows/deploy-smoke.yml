name: Deploy Smoke Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Deployed site URL to smoke test'
        required: false
        default: 'https://chroma11y.app'
        type: string

jobs:
  smoke:
    permissions:
      contents: read
      checks: read
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium --with-deps

      - name: Resolve smoke target
        id: target
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
          INPUT_BASE_URL: ${{ inputs.base_url }}
        run: |
          should_run=true
          should_wait_for_pages=false
          reason=
          deployment_sha="$GITHUB_SHA"

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            if [[ "$HEAD_REPO" != "$REPOSITORY" ]]; then
              should_run=false
              reason="Cloudflare Pages preview URLs are not created for fork pull requests."
            else
              branch_alias=$(printf '%s' "$HEAD_REF" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//')

              if [[ -z "$branch_alias" ]]; then
                should_run=false
                reason="Could not derive a valid Pages branch alias from branch '$HEAD_REF'."
              else
                base_url="https://${branch_alias}.chroma11y.pages.dev"
                should_wait_for_pages=true
                deployment_sha="$HEAD_SHA"
              fi
            fi
          elif [[ "$EVENT_NAME" == "push" && "$REF_NAME" == "main" ]]; then
            base_url="https://chroma11y.app"
            should_wait_for_pages=true
          else
            base_url="${INPUT_BASE_URL:-https://chroma11y.app}"
          fi

          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"
          echo "should_wait_for_pages=$should_wait_for_pages" >> "$GITHUB_OUTPUT"
          echo "base_url=${base_url:-}" >> "$GITHUB_OUTPUT"
          echo "deployment_sha=$deployment_sha" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"

      - name: Skip deploy smoke
        if: steps.target.outputs.should_run != 'true'
        run: echo "${{ steps.target.outputs.reason }}"

      - name: Wait for Cloudflare Pages deployment for this commit
        if: steps.target.outputs.should_run == 'true' && steps.target.outputs.should_wait_for_pages == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ steps.target.outputs.deployment_sha }}
        run: |
          for attempt in {1..30}; do
            check_runs_json=$(gh api "repos/${REPOSITORY}/commits/${SHA}/check-runs")
            status=$(jq -r '.check_runs[] | select(.app.slug == "cloudflare-workers-and-pages" and .name == "Cloudflare Pages") | .status' <<<"$check_runs_json" | head -n1)
            conclusion=$(jq -r '.check_runs[] | select(.app.slug == "cloudflare-workers-and-pages" and .name == "Cloudflare Pages") | .conclusion' <<<"$check_runs_json" | head -n1)
            details_url=$(jq -r '.check_runs[] | select(.app.slug == "cloudflare-workers-and-pages" and .name == "Cloudflare Pages") | .details_url' <<<"$check_runs_json" | head -n1)

            if [[ -n "$status" ]]; then
              echo "Cloudflare Pages check status: $status (conclusion: ${conclusion:-n/a})"

              if [[ "$status" == "completed" ]]; then
                if [[ "$conclusion" == "success" ]]; then
                  echo "Cloudflare Pages deployment is ready: $details_url"
                  exit 0
                fi

                echo "Cloudflare Pages deployment failed for $SHA: ${details_url:-no details URL}" >&2
                exit 1
              fi
            fi

            echo "Waiting for Cloudflare Pages deployment for $SHA (attempt $attempt/30)..."
            sleep 20
          done

          echo "Timed out waiting for the Cloudflare Pages deployment for $SHA." >&2
          exit 1

      - name: Wait for deployed URL to respond
        if: steps.target.outputs.should_run == 'true'
        shell: bash
        env:
          BASE_URL: ${{ steps.target.outputs.base_url }}
        run: |
          for attempt in {1..20}; do
            if curl --silent --show-error --fail --location --output /dev/null "$BASE_URL"; then
              echo "Deploy target is reachable: $BASE_URL"
              exit 0
            fi

            echo "Waiting for deploy target $BASE_URL (attempt $attempt/20)..."
            sleep 15
          done

          echo "Timed out waiting for deploy target $BASE_URL." >&2
          exit 1

      - name: Run deploy smoke checks
        if: steps.target.outputs.should_run == 'true'
        run: npx playwright test e2e/deploy-smoke.spec.ts --project=chromium
        env:
          PLAYWRIGHT_TEST_BASE_URL: ${{ steps.target.outputs.base_url }}
          ARGOS_UPLOAD: 'false'

      - name: Upload smoke test report
        uses: actions/upload-artifact@v7
        if: always() && steps.target.outputs.should_run == 'true'
        with:
          name: deploy-smoke-report
          path: playwright-report/
          retention-days: 30
