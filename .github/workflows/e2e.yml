name: E2E Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      argos_upload:
        description: 'Temporarily ignored while Argos uploads are disabled'
        required: false
        default: false
        type: boolean

jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run E2E tests (pull request)
        if: github.event_name == 'pull_request'
        run: npx playwright test
        env:
          ARGOS_UPLOAD: 'false'

      - name: Run E2E tests (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: npx playwright test
        env:
          ARGOS_UPLOAD: 'false'

      - name: Run E2E tests (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npx playwright test
        env:
          ARGOS_UPLOAD: 'false'

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
